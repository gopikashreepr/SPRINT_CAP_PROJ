# Config for tech.grasshopper:extentreports-cucumber7-adapter
# This auto-generates a full Extent HTML report from the SAME Cucumber run
# that also produces the native Cucumber HTML/JSON reports (see TestRunner).

extent.reporter.spark.start=true
extent.reporter.spark.out=reports/spark/ExtentSparkReport.html
extent.reporter.spark.config=src/test/resources/extent-config.xml

screenshot.dir=reports/screenshots/
screenshot.rel.path=../screenshots/
