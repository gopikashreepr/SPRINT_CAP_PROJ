# =========================================================
# config.properties
# Central place for every environment value.
# Select active environment by passing -Denv=live or -Denv=mock
# on the command line (defaults to "live" if not supplied).
# Nothing in Java code or feature files should hardcode a URL,
# credential, or ISBN -- everything flows from here or from
# TestContext (for values generated/chained at runtime).
# =========================================================

# ---- Live environment (real ToolsQA BookStore API) ----
live.baseUrl=https://bookstore.toolsqa.com

# ---- Default active environment if -Denv is not passed ----
default.env=live

# ---- Seed / default test data (safe, non-secret placeholders) ----
# Real credentials for the Live run are generated at runtime (unique per run)
# to avoid "user already exists" failures - see utilities.RandomDataGenerator
default.password=Str0ng@Pass123

# ---- Sample ISBNs used across BookStore feature files ----
isbn1=9781449325862
isbn2=9781449331818
invalidIsbn=0000000000000

# ---- Request timeouts (ms) ----
connection.timeout=15000
read.timeout=15000

# ---- Reporting ----
extent.report.path=reports/ExtentReport.html
